[package]
name = "meeting-detection"
version = "0.1.0"
edition = "2021"
description = "Cross-platform meeting detection engine for Electron/Node.js"
license = "MIT"
repository = ""

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi-rs for JavaScript bindings
napi = { version = "2.3.1", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "2.3.1"

# Async runtime
tokio = { version = "1", features = ["rt", "time", "macros"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1.0"

# Cross-platform process detection
sysinfo = "0.30"

# Note: For v1, we use simple string matching. Regex can be added later if needed.

[target.'cfg(target_os = "macos")'.dependencies]
# Note: For v1, we use simplified detection. CoreAudio/AVFoundation can be added later.

[target.'cfg(target_os = "windows")'.dependencies]
# Note: For v1, we use PowerShell scripts. WinAPI can be added later for better performance.

[target.'cfg(target_os = "linux")'.dependencies]
# Note: For v1, we use xdotool/wmctrl. PulseAudio can be added later for mic detection.

[build-dependencies]
napi-build = "2.3.1"

