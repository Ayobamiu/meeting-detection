[package]
name = "meeting-detection"
version = "0.1.0"
edition = "2021"
description = "macOS meeting detection engine for Electron/Node.js"
license = "MIT"
repository = ""

[lib]
# "lib" is included alongside "cdylib" so `cargo test` can build the crate as a
# normal Rust library and run the unit tests.
crate-type = ["cdylib", "lib"]

[dependencies]
# napi-rs for JavaScript bindings
napi = { version = "2.3.1", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "2.3.1"

# Async runtime
tokio = { version = "1", features = ["rt", "time", "macros"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1.0"

# Process detection
sysinfo = "0.30"

# Note: For v1, we use simple string matching. Regex can be added later if needed.

[build-dependencies]
napi-build = "2.3.1"

